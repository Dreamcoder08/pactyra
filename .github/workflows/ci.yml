name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Rust clippy
        run: cargo clippy -- -D warnings

      - name: Go lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Rust tests
        run: cargo test

      - name: Go tests
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Rust
        run: cargo build --release

      - name: Build Go
        run: go build -o bin/pactyra ./cmd/pactyra

      - name: Verify binaries exist
        run: |
          test -f target/release/pactyra-core || echo "Rust binary not found (expected until SDD-002)"
          test -f bin/pactyra || echo "Go binary not found (expected until SDD-002)"

  golden-path:
    name: Golden Path (manual / nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Start cyber range
        run: docker compose -f cyber-range/docker-compose.yml up -d

      - name: Wait for targets
        run: sleep 15

      - name: Run golden path test
        run: go test -v -run TestGoldenPath ./tests/

      - name: Stop cyber range
        if: always()
        run: docker compose -f cyber-range/docker-compose.yml down
