# Test fixture: valid scope for golden path testing.
# Matches the cyber-range targets defined in cyber-range/docker-compose.yml.
#
# See: cyber-range/README.md for target details.

scope:
  name: 'Pactyra Golden Path Test'
  description: 'Test scope for v0.1 golden path validation against local cyber range'

  targets:
    cidr:
      - '10.0.1.0/24'
    domains:
      - 'test-target.local'
      - 'vulnerable-app.local'

  excluded:
    hosts:
      - '10.0.1.1' # Gateway — excluded from scanning

  ports:
    include:
      - '1-1000'
      - '8080'
      - '8443'

  authorized_techniques:
    - port_scanning
    - service_detection
    - os_detection

  engagement:
    operator: 'golden-path-tester'
    start_date: '2026-07-26'
    timezone: 'UTC'

# Expansion envelope — not enforced in v0.1, parsed for forward compatibility.
expansion_policy:
  approver_roles:
    - engagement_manager

  allowed:
    additional_subdomains: true
    discovered_ips_within_authorized_asn: true
    authenticated_test_accounts: false

  limits:
    maximum_new_assets: 10
    maximum_duration_extension_hours: 4
    maximum_rps: 10

  always_requires_customer_approval:
    - new_root_domain
    - new_cidr
    - production_disruption_risk
    - social_engineering
    - data_access_beyond_proof
